<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Dark mode configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'dark-bg': '#111827', // zinc-900
                        'dark-card': '#1f2937', // zinc-800  
                        'dark-border': '#374151', // zinc-700
                        'dark-text-primary': '#f9fafb', // zinc-50
                        'dark-text-secondary': '#9ca3af' // zinc-400
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-100 dark:bg-zinc-900 min-h-screen flex flex-col items-center justify-center py-12 px-4">
    <!-- Theme Toggle Button -->
    <button id="theme-toggle" 
        class="fixed top-4 right-4 z-50 p-2 rounded-full bg-white dark:bg-zinc-800 shadow-lg hover:shadow-xl transition-all duration-300"
        aria-label="Toggle theme">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-700 dark:text-zinc-300">
            <path class="sun-icon" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
            <path class="moon-icon hidden" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
        </svg>
    </button>

    <!-- Title -->
    <header class="mb-10 text-center">
        <h1 class="text-3xl sm:text-4xl lg:text-5xl font-semibold text-blue-700 dark:text-blue-400">
            Download Your Favourite YouTube Video
        </h1>
    </header>

    <!-- Main Form -->
    <form action="{{ url_for('main.home') }}" method="post"
        class="w-full max-w-6xl bg-white dark:bg-zinc-800 rounded-2xl shadow-2xl py-[40px] px-6 sm:px-16 space-y-10 min-h-[700px]">

        <!-- URL input + Search button -->
        <div>
            <label for="url_link" class="block font-semibold text-gray-700 dark:text-zinc-300 mb-3 text-lg">Enter URL:</label>
            <div class="flex flex-col sm:flex-row gap-4">
                <input type="text" id="url_link" name="search_url" placeholder="Enter the link of the video"
                    class="flex-1 rounded-lg border border-gray-300 dark:border-zinc-700 bg-white dark:bg-zinc-700 p-4 text-base focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-900 dark:text-zinc-100" />
                <button name="search" value="Search" id="in-between"
                    class="rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-3 text-base transition-colors duration-200">
                    Search
                </button>
            </div>
        </div>

        <!-- Video title -->
        <h2 class="text-xl font-semibold text-gray-800 dark:text-zinc-100 text-center">{{ title }}</h2>

        <!-- Thumbnail + action buttons -->
        <div class="flex flex-col sm:flex-row sm:items-start gap-6">
            {% if thumbnail %}
            <img src="{{ thumbnail }}" alt="Video Thumbnail"
                class="w-full sm:w-96 lg:w-[500px] h-auto rounded-xl shadow-lg" />
            {% endif %}

            <div class="flex flex-col gap-4 w-full sm:ml-4">
                <!-- Download Audio -->
                <button type="submit" name="download_audio_button_mine" id="audio_download_btn"
                    class="w-full rounded-lg bg-emerald-600 hover:bg-emerald-700 px-8 py-3 text-white text-base transition-colors duration-200"
                    style="visibility: {{ un_visible }};">
                    Download Audio
                </button>

                <!-- Download Video + Resolutions -->
                <div class="flex flex-col sm:flex-row justify-between gap-4 w-full">
                    <button type="submit" name="download_button_mine" id="video_download_btn"
                        class="w-full sm:w-1/2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-base transition-colors duration-200"
                        style="visibility: {{ un_visible }};">
                        Download Video
                    </button>

                    <select name="resolutions" id="resolutions"
                        class="w-full sm:w-1/2 rounded-lg border border-gray-300 dark:border-zinc-700 bg-white dark:bg-zinc-700 p-3 text-base text-gray-900 dark:text-zinc-100"
                        style="visibility: {{ un_visible }};">
                        {% for res in resolutions %}
                        <option value="{{ res }}" class="bg-white dark:bg-zinc-700 text-gray-900 dark:text-zinc-100">{{ res }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

        </div>
        </div>

        <!-- Video length -->
        <div class="mt-6 bg-gray-100 dark:bg-zinc-700 rounded-lg px-6 py-4 text-center shadow-sm border border-gray-200 dark:border-zinc-600"
            style="visibility: {{ un_visible }};">
            <p class="text-lg font-semibold text-gray-800 dark:text-zinc-100">
                <span class="text-blue-700 dark:text-blue-400">{{ videoLength }}</span>
            </p>
        </div>
    </form>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>

</html>
